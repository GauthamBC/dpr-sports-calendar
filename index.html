<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DPR Sports Events Calendar</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css">
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:#f6f7fb;color:#0f172a}
    .wrap{max-width:1100px;margin:0 auto;padding:18px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    h1{font-size:18px;margin:0}

    .cards{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:12px 12px 14px;box-shadow:0 10px 24px rgba(15,23,42,0.06)}
    .card .title{font-weight:800}
    .meta{margin-top:6px;color:#475569;display:flex;gap:10px;flex-wrap:wrap;font-size:14px}
    .section-title{margin:18px 0 10px;font-size:16px}
    .pill-date{display:inline-flex;align-items:center;border-radius:999px;padding:4px 10px;font-weight:800}
    .pill-f1{background:#ffe7ea;color:#b40012;border:1px solid rgba(180,0,18,.18)}
    .card{position:relative}
    .card.f1{border-color:rgba(180,0,18,.22)}
    .card.f1::before{
      content:"";
      position:absolute;left:0;top:0;bottom:0;width:6px;
      background:#e10600;border-radius:16px 0 0 16px;
    }
    .meta{align-items:center}
    .ideas{margin-top:8px;font-size:14px;color:#334155}
    .pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 8px;font-weight:700;background:#e7fff1;color:#007548}

    .cal{margin-top:16px;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:12px;box-shadow:0 10px 24px rgba(15,23,42,0.06)}
  
    /* ===== Monthly highlights horizontal scroller (NEW) ===== */
    #highlights{
      display:flex;
      gap:12px;
      overflow-x:auto;
      padding-bottom:10px;
      scroll-snap-type:x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    #highlights .card{
      flex: 0 0 auto;
      width: 320px;
      max-width: 86vw;
      scroll-snap-align:start;
    }
    /* Sleek red scrollbar */
    #highlights::-webkit-scrollbar{ height: 10px; }
    #highlights::-webkit-scrollbar-track{ background: rgba(225,6,0,0.08); border-radius:999px; }
    #highlights::-webkit-scrollbar-thumb{ background: rgba(225,6,0,0.55); border-radius:999px; }
    #highlights::-webkit-scrollbar-thumb:hover{ background: rgba(225,6,0,0.75); }
    /* Firefox */
    #highlights{ scrollbar-color: rgba(225,6,0,0.55) rgba(225,6,0,0.08); scrollbar-width: thin; }

  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h1>🏆 DPR Sports Events Calendar</h1>
    </div>
    
    <h2 class="section-title" id="monthTitle">Monthly highlights</h2>
    <div id="highlights"></div>

    <div class="cal">
      <div id="calendar"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
